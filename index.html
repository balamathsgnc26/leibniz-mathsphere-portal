

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Leibniz MathSphere | Student Portal</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="top-header">
    <img src="logo.png" alt="Leibniz MathSphere Logo" class="academy-logo">
    <div>
      <h1>LEIBNIZ MATHSPHERE</h1>
      <p>FROM FUNDAMENTALS TO INFINITY</p>
    </div>
  </header>

  <main class="login-container">

    <div class="gold-line"></div>

    <h2>Student Portal</h2>
    <p class="welcome">Welcome! Please sign in to continue.</p>

    <form id="loginForm">

      <label for="registration">Registration Number</label>
      <input
        type="text"
        id="registration"
        placeholder="Enter your registration number"
        autocomplete="username"
        required
      >

      <label for="password">Password</label>
      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button type="submit">SIGN IN</button>

      <p id="message"></p>

    </form>

    <div class="bottom-line"></div>

    <footer>
      © 2026 Leibniz MathSphere
      <span>Excellence in Mathematics</span>
    </footer>

  </main>

  <script type="module" src="app.js"></script>

</body>
</html>
