
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leibniz MathSphere | Student Portal</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #07152f, #142c50);
}

.login-card {
  width: 100%;
  max-width: 430px;
  background: white;
  border-radius: 18px;
  padding: 35px 28px;
  text-align: center;
  box-shadow: 0 15px 45px rgba(0,0,0,.3);
}

.logo {
  width: 90px;
  height: 90px;
  object-fit: contain;
  margin-bottom: 12px;
}

h1 { color: #10264b; font-size: 25px; }
h2 { color: #10264b; font-size: 19px; }

.tagline {
  color: #b08a35;
  font-size: 12px;
  letter-spacing: 2px;
  margin-bottom: 30px;
}

input {
  width: 100%;
  padding: 15px;
  margin: 15px 0;
  border: 1px solid #c8b477;
  border-radius: 8px;
  font-size: 16px;
}

button {
  width: 100%;
  padding: 15px;
  background: #c6a34c;
  color: #10264b;
  border: none;
  border-radius: 8px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  margin-top: 18px;
  font-size: 14px;
}

.footer {
  margin-top: 30px;
  color: #777;
  font-size: 12px;
}
</style>
</head>

<body>

<div class="login-card">

<img src="./logo.png" class="logo" alt="Leibniz MathSphere Logo"
onerror="this.style.display='none'">

<h1>LEIBNIZ MATHSPHERE</h1>
<div class="tagline">FROM FUNDAMENTALS TO INFINITY</div>

<h2>STUDENT LOGIN</h2>
<p>Enter your registration number</p>

<form id="loginForm">
<input
type="text"
id="registration"
placeholder="Enter Registration Number"
autocomplete="off"
required>
<button type="submit">LOGIN</button>
</form>

<div id="message" role="status"></div>

<div class="footer">© 2026 Leibniz MathSphere</div>

</div>

<script>
const pages = [
{
prefix: "LMSSS09202",
url: "https://sites.google.com/view/leibnizmathsphereacademy/class-9"
},
{
prefix: "LMSSS10202",
url: "https://sites.google.com/view/leibnizmathsphereacademy/class-10"
},
{
prefix: "LMSHS11202",
url: "https://sites.google.com/view/leibnizmathsphereacademy/class-11"
},
{
prefix: "LMSHS12202",
url: "https://sites.google.com/view/leibnizmathsphereacademy/class-12"
},
{
prefix: "LMSUMEM202",
url: "https://sites.google.com/view/leibnizmathsphereacademy/university-mathematics"
}
];

const form = document.getElementById("loginForm");

form.addEventListener("submit", function(event) {
event.preventDefault();

const registration = document
.getElementById("registration")
.value.trim().toUpperCase();

const message = document.getElementById("message");

const matchedPage = pages.find(page =>
registration.startsWith(page.prefix)
);

if (!matchedPage) {
message.style.color = "#b3261e";
message.textContent = "Invalid registration number. Please check and try again.";
return;
}

message.style.color = "#167a43";
message.textContent = "Login successful! Redirecting...";

window.location.assign(matchedPage.url);
});
</script>

</body>
</html>
